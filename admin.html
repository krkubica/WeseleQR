<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Panel gospodarza · Wesele Patrycji i Krzysztofa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app-shell"><section class="card admin-card">
      <header class="masthead"><span class="eyebrow">PANEL GOSPODARZA</span><h1>Wyniki wesela</h1><p>Patrycja &amp; Krzysztof · 22.08.2026</p></header>
      <section id="loginPanel" class="view is-active"><p class="eyebrow">DOSTĘP PRYWATNY</p><h2>Zaloguj się</h2><p class="lead">Użyj adresu e-mail administratora ustawionego w Firebase.</p><label class="sr-only" for="adminEmail">E-mail</label><input id="adminEmail" class="nickname-input" type="email" autocomplete="email" placeholder="Twój e-mail" /><label class="sr-only" for="adminPassword">Hasło</label><input id="adminPassword" class="nickname-input admin-input" type="password" autocomplete="current-password" placeholder="Hasło" /><button id="loginButton" class="button button-primary">Wejdź do panelu</button><p id="loginError" class="form-error" role="alert"></p></section>
      <section id="dashboardPanel" class="view" aria-hidden="true"><div class="dashboard-top"><div><p class="eyebrow">NA ŻYWO</p><h2>Tablica wyników</h2></div><button id="refreshButton" class="button button-secondary small-button">Odśwież</button></div><div class="stat-grid"><article><b id="guestCount">0</b><span>gości</span></article><article><b id="missionCount">0</b><span>misji</span></article><article><b id="photoCount">0</b><span>zdjęć</span></article><article><b id="averageCount">0</b><span>średnio / gościa</span></article></div><p id="dashboardStatus" class="task-hint"></p><div id="ranking" class="ranking"></div><button id="logoutButton" class="button button-secondary">Wyloguj</button></section>
    </section></main><script type="module" src="admin.js"></script>
  </body>
</html>
